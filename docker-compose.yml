version: '3.9'

services:

  frontend:
    build:
      context: ./frontend
    container_name: ons-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: ons-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env.development
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    container_name: ons-worker
    command: npm run worker
    restart: always
    env_file:
      - .env.development
    depends_on:
      - backend
      - redis

  postgres:
    image: postgres:15
    container_name: ons-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onlinenetsoft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ons-redis
    restart: always
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: ons-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: